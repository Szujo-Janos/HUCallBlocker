# Magyar nyelvű fordítási és ellenőrzési munkafolyamat.
name: Android fordítás

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Java 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36 telepítése
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Tesztek és fejlesztői APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Fejlesztői APK mentése
        uses: actions/upload-artifact@v4
        with:
          name: HUCallBlocker-fejlesztoi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Kiadási változat fordítása aláírás nélkül
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew --no-daemon assembleRelease

      - name: Aláíratlan kiadási APK mentése
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HUCallBlocker-ALAirATLAN-kiadas
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
