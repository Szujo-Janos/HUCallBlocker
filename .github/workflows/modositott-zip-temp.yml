name: Módosított fájlok csomagolása
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modositott-zip-temp.yml'
permissions:
  contents: read
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Változott fájlok csomagolása
        shell: bash
        run: |
          set -euo pipefail
          BASE='781c86a42bdf63de8f023d9305910b8daf97c26f'
          TARGET='1e7c7c5c64448cd3eb278812c770dd17b6767f7c'
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$TARGET")
          test "${#files[@]}" -eq 14
          git archive --format=zip --output=HUCallBlocker_1.1.5_modositott_fajlok.zip "$TARGET" -- "${files[@]}"
          unzip -t HUCallBlocker_1.1.5_modositott_fajlok.zip
      - name: ZIP mentése
        uses: actions/upload-artifact@v4
        with:
          name: HUCallBlocker-1.1.5-modositott
          path: HUCallBlocker_1.1.5_modositott_fajlok.zip
          retention-days: 2
          if-no-files-found: error
