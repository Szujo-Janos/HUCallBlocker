name: Internal Android signing tools export
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/signing-tools-temp.yml"
  workflow_dispatch:
jobs:
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Locate SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign -o -name apksigner
      - name: Install build tools 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"
      - name: Export signing CLI for local build
        shell: bash
        run: |
          cd "$ANDROID_HOME/build-tools/36.0.0"
          tar -czf "$GITHUB_WORKSPACE/local-signing-tools.tar.gz" apksigner lib/apksigner.jar zipalign lib64
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: temporary-local-signing-cli
          path: local-signing-tools.tar.gz
          retention-days: 1
