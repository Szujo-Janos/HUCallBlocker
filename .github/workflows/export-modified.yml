name: Export v1.1.0 modified files
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - ".github/workflows/export-modified.yml"
  workflow_dispatch:
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package modified Android Studio files
        uses: actions/upload-artifact@v4
        with:
          name: HUCallBlocker-v1.1.0-modositott-fajlok
          retention-days: 30
          if-no-files-found: error
          path: |
            build.gradle.kts
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            app/src/main/java/hu/szujo/hucallblocker/MainActivity.kt
            app/src/main/res/values/styles.xml
            README.md
            CHANGELOG.md
