name: Export v1.0.2 modified files

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/export-v1.0.2.yml

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the modified Android Studio files
        uses: actions/upload-artifact@v4
        with:
          name: HUCallBlocker-v1.0.2-modositott-fajlok
          path: |
            app/src/main/java/hu/szujo/hucallblocker/MainActivity.kt
            app/build.gradle.kts
            README.md
            CHANGELOG.md
          retention-days: 30
          if-no-files-found: error
