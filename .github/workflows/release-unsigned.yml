name: Release unsigned build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-unsigned.yml"
      - "app/**"
      - "build.gradle.kts"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests + release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Upload UNSIGNED release APK
        uses: actions/upload-artifact@v4
        with:
          name: HUCallBlocker-v1.1.3-UNSIGNED-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
